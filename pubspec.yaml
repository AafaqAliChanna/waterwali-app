name: waterwali_app
description: "WaterWali — water tanker delivery for Karachi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  provider: ^6.1.5+1

  # Added for Phase A — customer order placement
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2 
  url_launcher: ^6.3.1
  stomp_dart_client: ^2.1.0
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
